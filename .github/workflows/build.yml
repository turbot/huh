name: build
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.22, stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: "on"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go mod download
      - run: go build -v ./...
      - run: go test -v -race ./...
  spinner:
    strategy:
      matrix:
        go-version: [1.22, stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: "on"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          working-directory: ./spinner
      - run: go mod download
        working-directory: ./spinner
      - run: go build -v ./...
        working-directory: ./spinner
      - run: go test -v -race ./...
        working-directory: ./spinner
  examples:
    strategy:
      matrix:
        go-version: [1.22, stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: "on"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          working-directory: ./examples
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go mod download
        working-directory: ./examples
      - run: go build -v ./...
        working-directory: ./examples
      - run: go test -v -race ./...
        working-directory: ./examples
